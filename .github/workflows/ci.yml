name: CI (typecheck + lint + test + web build)

# Fast checks on every push and PR. No Mac runner needed; this validates the
# TypeScript/React layer, the catalog that ships inside the app, and the
# production bundle. iOS compilation happens in ios-release.yml.

on:
  push:
    branches: [main, dev, frontier-go]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Lint
        working-directory: app
        run: npm run lint

      # Includes shipped-catalog.test.ts, which re-runs the rights, safety and
      # quality gates against the catalog file in the bundle. A regenerated
      # catalog that smuggles in a copyrighted clip or a malformed URL fails
      # here rather than on someone's television.
      - name: Test
        working-directory: app
        run: npm run test

      - name: Store listing parses and fits Apple's limits
        run: node --test .github/scripts/asc-store.test.mjs

      - name: Build (Vite)
        working-directory: app
        run: npm run build

      - name: Verify the catalog shipped into the bundle
        working-directory: app
        run: |
          set -e
          test -f dist/catalog/frontier-catalog.json
          node -e "
            const c = require('./dist/catalog/frontier-catalog.json');
            if (!c.items || c.items.length < 50) { console.error('::error::catalog too small'); process.exit(1); }
            console.log('catalog:', c.items.length, 'items, generated', c.generatedAt);
          "
