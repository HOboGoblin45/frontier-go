name: iOS simulator compile
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          VITE_TMDB_API_KEY: dummy-for-compile-only
          VITE_ENABLE_THEATER_MODE: 'false'
      - run: npx cap sync ios
        working-directory: app
      - name: Compile app and native plugins without signing
        run: xcodebuild -workspace app/ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-check CODE_SIGNING_ALLOWED=NO build
      - name: Verify bundled privacy manifest
        run: plutil -lint build/ios-check/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy
