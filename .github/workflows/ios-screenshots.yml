name: iOS simulator screenshots

# There is no Mac on this project, so this runner is the only place the app can
# actually be launched. It is a gate as much as a capture: the compile check
# proves the app builds, this proves it does not die on launch and renders on
# iOS. See docs/RELEASE-REVIEW-2026-09.md.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 6.9-inch
            devices: 'iPhone 16 Pro Max,iPhone 17 Pro Max,iPhone 16 Plus'
          - label: 13-inch
            devices: 'iPad Pro 13-inch (M4),iPad Pro 13-inch (M5),iPad Pro (12.9-inch) (6th generation)'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the web app
        working-directory: app
        run: npm run build
        env:
          # A real key so the stage has real artwork. The captures are the
          # point; a dummy key would photograph the error state.
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_ENABLE_THEATER_MODE: 'false'
      - run: npx cap sync ios
        working-directory: app
      - name: Build for the simulator
        run: |
          xcodebuild -workspace app/ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-shots CODE_SIGNING_ALLOWED=NO build
      - name: Read POLICY_VERSION from the source of truth
        id: policy
        run: |
          v=$(node -e "import('./app/src/lib/release.js').then(m=>console.log(m.POLICY_VERSION))" 2>/dev/null \
            || grep -oE "POLICY_VERSION = '[^']+'" app/src/lib/release.js | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "POLICY_VERSION=$v"
      - name: Boot, launch and capture
        run: |
          bash scripts/ci-simulator-screenshots.sh \
            "${{ matrix.devices }}" \
            "screenshots-native/${{ matrix.label }}" \
            "build/ios-shots/Build/Products/Debug-iphonesimulator/App.app" \
            "${{ steps.policy.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-screenshots-${{ matrix.label }}
          path: screenshots-native/${{ matrix.label }}
          if-no-files-found: error
