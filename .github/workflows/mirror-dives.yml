name: Mirror dive footage

# Publishes dive camera footage for Dive Replay. NOAA's archive keeps each
# dive's recordings in one compressed zip that cannot be streamed; this cuts
# the main camera's five-minute segments out of it, remuxes them for
# streaming (no re-encode, no audio), uploads them to the frontier go bucket
# and marks them in app/data/dives. See app/tools/dives/mirror.ts.
#
# Needs these repository secrets: MIRROR_ENDPOINT, MIRROR_BUCKET,
# MIRROR_ACCESS_KEY_ID, MIRROR_SECRET_ACCESS_KEY, MIRROR_PUBLIC_BASE
# (and optionally MIRROR_REGION). Run with dry_run first.

on:
  workflow_dispatch:
    inputs:
      dives:
        description: 'Dive ids, comma-separated (blank = the top N by sightings)'
        required: false
        default: ''
      top:
        description: 'How many dives when no ids are given'
        required: false
        default: '10'
      bottom_only:
        description: 'Only the time on the bottom (plus ten minutes either side)'
        type: boolean
        default: true
      max_gb:
        description: 'Stop after uploading this many GB'
        required: false
        default: '40'
      dry_run:
        description: 'Only report what would be mirrored'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dive-data
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        working-directory: app
        run: npm ci

      - name: Mirror
        working-directory: app
        env:
          MIRROR_ENDPOINT: ${{ secrets.MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ secrets.MIRROR_BUCKET }}
          MIRROR_ACCESS_KEY_ID: ${{ secrets.MIRROR_ACCESS_KEY_ID }}
          MIRROR_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_SECRET_ACCESS_KEY }}
          MIRROR_PUBLIC_BASE: ${{ secrets.MIRROR_PUBLIC_BASE }}
          MIRROR_REGION: ${{ secrets.MIRROR_REGION }}
        run: |
          ARGS="--max-gb ${{ github.event.inputs.max_gb }}"
          if [ -n "${{ github.event.inputs.dives }}" ]; then ARGS="$ARGS --dives ${{ github.event.inputs.dives }}"; else ARGS="$ARGS --top ${{ github.event.inputs.top }}"; fi
          if [ "${{ github.event.inputs.bottom_only }}" = "true" ]; then ARGS="$ARGS --bottom-only"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npx tsx tools/dives/mirror.ts $ARGS

      # A published segment has to actually play from its public address.
      - name: Check one published segment is reachable
        if: github.event.inputs.dry_run != 'true'
        working-directory: app
        run: |
          URL=$(node -e "
            const fs=require('fs');const dir='data/dives';
            for (const f of fs.readdirSync(dir)) { if (!f.startsWith('EX')) continue;
              const d=JSON.parse(fs.readFileSync(dir+'/'+f,'utf8'));
              const s=(d.segments||[]).find(x=>x.mirrored);
              if (d.videoBase && s) { console.log(d.videoBase+encodeURIComponent(s.file)); break; } }")
          echo "$URL"
          curl -sfI "$URL" | grep -iE '^(HTTP|content-type|content-length|accept-ranges)'

      - name: Commit the mirrored segments
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/dives
          if git diff --staged --quiet; then echo "Nothing new mirrored."; exit 0; fi
          git commit -m "dives: mirrored footage for Dive Replay"
          git push
